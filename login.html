<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/login.css">
</head>
<body>
    <div id="container">
        <img src="img/logo.png" alt="" width="80">
        <div id="login">
            <h2>Faça o seu login</h2>
            <form action="login1.html" method="get">
                <label for="iemail">Email </label>
                <input type="email" name="email" id="iemail" required> <br>

                <label for="isenha">Senha </label>
                <input type="password" name="senha" id="isenha" minlength="8" maxlength="16" required> <br>

                <input id="b1" type="submit" value="Entrar">

            </form>
            <a href="cadastro.html">Ou cadastre-se</a>
        </div>
    </div>
</body>
</html>
